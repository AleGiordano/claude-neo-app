<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NEO · Pase Activo · Prototipo dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Wix+Madefor+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* =====================================================================
   NEO · Pase Activo (QR) — Prototipo interactivo (pixel perfect)
   Tokens y estructura tomados directo de Figma:
     · QR / Pase Activo → 21032:51926
   Mismo sistema de tokens y device frame que index.html (Explorar).
   ===================================================================== */

:root{
  /* Surfaces */
  --surface-50:#0F1217;   --surface-100:#161A22;
  --surface-200:#1A1E26;  --surface-300:#212631;
  --surface-400:#242A36;  --surface-500:#3D475A;
  --surface-800:#BBBDC1;  --surface-950:#FFFFFF;
  /* Borders */
  --border-50:#33384A;    --border-100:#444D62;   --border-200:#565F7D;
  /* Brand */
  --secondary-100:#0021AF; --secondary-300:#002EF7;
  --secondary-400:#3358F9; --secondary-600:#8A9FFB;
  /* Text */
  --text-600:#D4D4D4; --text-800:#E5E5E5; --text-900:#F5F5F5; --text-950:#FEFEFF;
  /* Warning (timer pill) */
  --warning-50:#FEF4AA; --warning-400:#EEBB39; --warning-bg:#3C331D;
  /* Success */
  --success-500:#BDE986; --success-bg:#1C2B21;
  /* Type */
  --display:'Sora', ui-sans-serif, system-ui;
  --body:'Wix Madefor Display', ui-sans-serif, system-ui;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#06070a;color:var(--text-950);font-family:var(--body);-webkit-font-smoothing:antialiased}

body{
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:48px 16px;
  background:
    radial-gradient(900px 600px at 80% -10%, rgba(0,46,247,.18), transparent 60%),
    radial-gradient(700px 500px at -10% 100%, rgba(82,115,250,.10), transparent 60%),
    #06070a;
}

/* ===================== ESCENARIO SELECTOR (lateral derecho) ===================== */
.scenario-dock{
  position:fixed; right:24px; top:50%; transform:translateY(-50%); z-index:1000;
  display:flex; flex-direction:column; gap:4px; width:216px; max-height:calc(100vh - 48px); overflow:auto;
  padding:16px; border-radius:18px;
  background:rgba(22,26,34,.74); border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 20px 50px rgba(0,0,0,.45);
  scrollbar-width:none;
}
.scenario-dock::-webkit-scrollbar{display:none}
.scenario-dock .dock-title{
  font-family:var(--display); font-weight:600; font-size:11px; letter-spacing:.10em;
  text-transform:uppercase; color:var(--surface-800); margin:0 0 10px 2px;
}
.scenario-dock .group-label{
  font-family:var(--display); font-weight:600; font-size:11px; letter-spacing:.04em;
  color:var(--secondary-600); margin:12px 0 4px 2px;
}
.scenario-dock .group-label:first-of-type{margin-top:0}
.scenario-dock .sc-btn{
  border:0; cursor:pointer; border-radius:10px; width:100%; text-align:left;
  padding:9px 12px; background:transparent; color:var(--text-800);
  font-family:var(--display); font-weight:500; font-size:13px; line-height:18px;
  transition:background .18s ease, color .18s ease;
}
.scenario-dock .sc-btn:hover{background:rgba(255,255,255,.06); color:var(--text-950)}
.scenario-dock .sc-btn.active{background:var(--secondary-300); color:#fff}

@media (max-width:960px){
  .scenario-dock{top:auto; bottom:16px; right:50%; transform:translateX(50%); flex-direction:row; flex-wrap:wrap; width:auto; max-width:calc(100vw - 32px)}
  .scenario-dock .dock-title, .scenario-dock .group-label{width:100%}
}

.back-link{
  position:fixed; top:24px; left:24px; z-index:1000;
  display:inline-flex; align-items:center; gap:8px;
  padding:10px 16px; border-radius:999px; text-decoration:none;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
  color:var(--text-950); font-family:var(--display); font-weight:500; font-size:13px;
  backdrop-filter:blur(12px); transition:background .2s ease;
}
.back-link:hover{background:rgba(255,255,255,.12)}
.back-link svg{width:14px;height:14px}

/* ===================== DEVICE FRAME ===================== */
.device{
  width:390px; height:844px;
  border-radius:42px; position:relative; overflow:hidden;
  background:var(--surface-50);
  box-shadow:
    0 30px 80px rgba(0,0,0,.55),
    0 0 0 8px #1c1f26,
    0 0 0 9px #2a2f3a,
    inset 0 0 0 1px rgba(255,255,255,.04);
}
.notch{
  position:absolute; left:50%; top:10px; transform:translateX(-50%);
  width:118px; height:32px; border-radius:18px; background:#000; z-index:80;
}
.screen{position:absolute; inset:0; display:flex; flex-direction:column; overflow:hidden}

/* Fondo azul de la pantalla (fijo, se funde a dark hacia abajo) */
.screen::before{
  content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(120% 60% at 50% -8%, rgba(51,88,249,.55) 0%, rgba(0,46,247,0) 55%),
    linear-gradient(180deg,
      #0B2AD1 0%,
      #0A24B4 10%,
      rgba(9,32,150,.72) 24%,
      rgba(9,30,120,.30) 38%,
      rgba(15,18,23,0) 52%),
    var(--surface-50);
}

/* ===================== STATUS BAR ===================== */
.status-bar-area{
  position:absolute; top:0; left:0; right:0; height:54px; z-index:100;
  pointer-events:none; padding-top:10px; background:transparent;
}
.status-bar{display:flex; height:44px; align-items:center}
.status-bar .left, .status-bar .right{flex:1; padding:0 24px; display:flex; align-items:center; height:100%}
.status-bar .left{justify-content:flex-start}
.status-bar .right{justify-content:flex-end; gap:8px}
.status-bar .time{
  font-family:'Helvetica',ui-sans-serif,system-ui;
  font-size:17px; line-height:22px; color:var(--text-950); letter-spacing:-0.408px;
}

/* ===================== HEADER (Hoy Jueves 19 + cerrar) — fijo ===================== */
.pase-header{
  position:absolute; top:54px; left:0; right:0; height:49px; z-index:90;
  display:flex; align-items:center; justify-content:center; padding:0 20px;
}
.pase-header h1{
  margin:0; font-family:var(--display); font-weight:500; font-size:17px;
  line-height:24px; color:var(--text-950);
}
.pase-header .close{
  position:absolute; right:16px; top:50%; transform:translateY(-50%);
  width:32px; height:32px; border:0; background:transparent; cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:var(--text-950);
  border-radius:999px; transition:background .18s ease;
}
.pase-header .close:hover{background:rgba(255,255,255,.10)}
.pase-header .close svg{width:22px;height:22px}

/* ===================== SCROLL ===================== */
.scroll{
  position:absolute; inset:0; z-index:10; overflow-y:auto; overflow-x:hidden;
  padding-top:103px; padding-bottom:40px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.scroll::-webkit-scrollbar{display:none}
.container{padding:20px; display:flex; flex-direction:column; gap:16px}

/* ===================== PROMO TOAST (con ilustración) ===================== */
.promo{
  position:relative; border-radius:12px; overflow:visible;
  padding:12px 20px 12px 60px; min-height:98px;
  display:flex; align-items:center; gap:12px;
  background:
    linear-gradient(100.97deg, rgba(0,46,247,.9) 10.93%, rgba(0,46,247,0) 39.65%),
    linear-gradient(207deg, rgba(17,19,23,.2) 39.76%, rgba(96,111,140,.2) 151.02%);
  transition:opacity .3s ease, transform .3s ease, max-height .35s ease, margin .35s ease, padding .35s ease;
}
.promo.dismissed{opacity:0; overflow:hidden; transform:translateY(-6px); max-height:0; min-height:0; padding-top:0; padding-bottom:0; margin-top:-16px; pointer-events:none}
.promo .ill{
  position:absolute; left:-6px; top:50%; transform:translateY(-50%);
  width:56px; height:56px; object-fit:contain;
  filter:drop-shadow(0 6px 14px rgba(0,46,247,.35));
}
.promo .copy{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.promo .copy .t1{font-family:var(--body); font-weight:700; font-size:14px; line-height:24px; color:var(--text-800)}
.promo .copy .t2{font-family:var(--body); font-weight:400; font-size:14px; line-height:24px; color:var(--text-800)}
.pill-btn{
  flex-shrink:0; height:36px; padding:0 16px; border:0; cursor:pointer;
  background:var(--secondary-300); border-radius:12px; color:var(--text-800);
  font-family:var(--display); font-weight:600; font-size:12px; line-height:22px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:filter .18s ease, transform .12s ease;
}
.pill-btn:hover{filter:brightness(1.08)}
.pill-btn:active{transform:scale(.97)}

/* ===================== TICKET ===================== */
.ticket{
  position:relative; background:var(--surface-100); border-radius:24px;
  box-shadow:0 0 40px rgba(38,38,38,.20), inset 0 0 0 1px rgba(255,255,255,.03);
}
.ticket-section{padding:0}

/* Perforación entre secciones */
.perf{position:relative; height:22px}
.perf::before, .perf::after{
  content:""; position:absolute; top:50%; transform:translateY(-50%);
  width:22px; height:22px; border-radius:999px; background:var(--surface-50);
}
.perf::before{left:-11px}
.perf::after{right:-11px}
.perf .dash{
  position:absolute; left:14px; right:14px; top:50%; transform:translateY(-50%);
  border-top:1.5px dashed var(--border-100); opacity:.9;
}

/* --- Sección 1: header del ticket --- */
.tk-head{display:flex; flex-direction:column; align-items:center; padding:32px 16px 24px}
.timer-pill{
  display:inline-flex; align-items:center; gap:8px;
  height:38px; padding:0 16px; border-radius:999px;
  background:var(--warning-bg); border:1px solid var(--warning-400);
  color:var(--warning-50); font-family:var(--body); font-weight:500; font-size:14px; line-height:24px;
  transition:border-color .3s ease, color .3s ease, background .3s ease;
}
.timer-pill svg{width:16px;height:16px; flex-shrink:0}
.timer-pill.urgent{animation:pulseWarn 1.4s ease-in-out infinite}
@keyframes pulseWarn{0%,100%{box-shadow:0 0 0 0 rgba(238,187,57,0)}50%{box-shadow:0 0 0 4px rgba(238,187,57,.18)}}

.tk-title{
  margin:20px 0 0; font-family:var(--display); font-weight:700; font-size:20px;
  line-height:30px; color:var(--text-950); text-align:center;
}
.qr-box{
  margin-top:24px; width:220px; height:220px; background:#fff; border-radius:16px;
  display:flex; align-items:center; justify-content:center; padding:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.qr-box canvas, .qr-box img{width:100%!important; height:100%!important; display:block; border-radius:4px}
.pager{margin-top:20px; display:flex; align-items:center; gap:8px; width:220px}
.pager .dot{width:6px; height:6px; border-radius:999px; background:var(--secondary-300); flex-shrink:0}
.pager .track{flex:1; height:4px; border-radius:999px; background:var(--surface-400)}

/* --- Sección 2 --- */
.tk-mid{padding:32px 16px 24px; display:flex; flex-direction:column}
.tk-eyebrow{font-family:var(--body); font-weight:400; font-size:14px; line-height:24px; color:var(--surface-800); text-align:center}
.tk-h2{margin:2px 0 0; font-family:var(--display); font-weight:700; font-size:20px; line-height:30px; color:var(--text-950); text-align:center}

.notif{
  position:relative; margin-top:24px; border-radius:12px; overflow:hidden;
  padding:12px 40px 12px 55px; min-height:72px; display:flex; align-items:center; gap:12px;
  background:
    linear-gradient(130.6deg, rgba(0,46,247,.90) 10.9%, rgba(0,46,247,0) 39.6%),
    linear-gradient(186.6deg, rgba(17,19,23,.20) 39.8%, rgba(96,111,140,.20) 151%),
    var(--surface-200);
  transition:opacity .3s ease, transform .3s ease, max-height .35s ease, margin .35s ease, padding .35s ease;
}
.notif.dismissed{opacity:0; transform:translateY(-6px); max-height:0; min-height:0; padding-top:0; padding-bottom:0; margin-top:0; pointer-events:none}
.notif .ill{
  position:absolute; left:-16px; top:50%; transform:translateY(-50%);
  width:66px; height:74px; object-fit:contain;
  filter:drop-shadow(0 6px 14px rgba(0,46,247,.30));
}
.notif .copy{flex:1; min-width:0; font-family:var(--body); font-weight:400; font-size:14px; line-height:24px; color:var(--text-800)}
.notif .x{
  position:absolute; right:12px; top:12px; width:18px; height:18px; border:0; cursor:pointer;
  background:transparent; color:var(--text-800); display:flex; align-items:center; justify-content:center; padding:0;
}
.notif .x svg{width:14px;height:14px}
.pill-btn.is-on{background:var(--success-bg); color:var(--success-500); cursor:default}
.pill-btn.is-on:hover{filter:none}

/* Timeline check-in / check-out */
.timeline{margin-top:36px; display:flex; gap:17px}
.tl-flow{position:relative; width:11px; padding-top:9px; display:flex; flex-direction:column; align-items:center}
.tl-flow .node{width:5px; height:5px; border-radius:999px; background:var(--surface-800)}
.tl-flow .node.done{background:var(--secondary-400)}
.tl-flow .bar{width:1.5px; flex:1; background:var(--border-50); margin:4px 0; border-radius:2px}
.tl-rows{flex:1; display:flex; flex-direction:column}
.tl-row{display:flex; align-items:center; justify-content:space-between; height:24px}
.tl-left{display:flex; align-items:center; gap:8px; color:var(--text-900)}
.tl-left svg{width:16px;height:16px; color:var(--surface-800)}
.tl-left .lbl{font-family:var(--body); font-weight:500; font-size:14px; line-height:24px}
.tl-time{display:flex; align-items:center; gap:6px; color:var(--text-800); font-family:var(--body); font-weight:500; font-size:14px; line-height:24px}
.tl-time svg{width:14px;height:14px; color:var(--surface-800)}
.tl-sep{height:1px; background:var(--surface-400); margin:12px 0}

/* --- Sección 3 --- */
.tk-foot{padding:32px 24px 32px; display:flex; flex-direction:column; align-items:center; gap:20px}
.tk-foot .note{font-family:var(--body); font-weight:400; font-size:14px; line-height:24px; color:var(--surface-800); text-align:center; max-width:302px}
.cta{
  width:100%; max-width:302px; height:44px; border:0; cursor:pointer;
  background:var(--secondary-300); border-radius:12px; color:#fff;
  font-family:var(--display); font-weight:600; font-size:15px; line-height:24px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:filter .18s ease, transform .12s ease;
}
.cta:hover{filter:brightness(1.08)}
.cta:active{transform:scale(.985)}
.cta svg{width:18px;height:18px}

/* Snackbar feedback (arriba, sobre el header) */
.toast{
  position:absolute; top:56px; left:50%; transform:translateX(-50%) translateY(-16px);
  z-index:200; max-width:calc(100% - 32px);
  display:flex; align-items:center; gap:12px;
  padding:14px 18px 14px 14px; border-radius:12px;
  background:rgba(33,38,49,.97); border:1px solid var(--border-50); color:var(--text-950);
  font-family:var(--body); font-weight:700; font-size:14px; line-height:24px; white-space:nowrap;
  box-shadow:0 2px 10px rgba(38,38,38,.5);
  opacity:0; pointer-events:none; transition:opacity .28s ease, transform .28s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.toast .ic{width:20px; height:20px; flex-shrink:0; display:none; align-items:center; justify-content:center}
.toast .ic svg{width:20px; height:20px}
.toast .msg{flex:1}
.toast.success{background:#E9FFA1; border-color:transparent; color:#171717}
.toast.success .ic{display:flex; color:#3B6B12}
</style>
</head>
<body>

<a class="back-link" href="issues.html">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
  Issues
</a>

<div class="scenario-dock" id="scenarioDock"></div>

<div class="device">
  <div class="screen">
    <div class="notch"></div>

    <!-- Status bar -->
    <div class="status-bar-area">
      <div class="status-bar">
        <div class="left"><span class="time">9:00</span></div>
        <div class="right">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="white"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="white"><path d="M8.5 12L11 9.5C9.6 8.1 7.4 8.1 6 9.5L8.5 12Z"/><path d="M3.5 7C6.3 4.2 10.7 4.2 13.5 7L15.5 5C11.5 1 5.5 1 1.5 5L3.5 7Z"/><path d="M0.5 4C5 -0.5 12 -0.5 16.5 4L14.5 6C11.4 2.9 5.6 2.9 2.5 6L0.5 4Z" opacity=".6"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="2.5" stroke="white" opacity=".55"/><rect x="2" y="2" width="19" height="9" rx="1.5" fill="white"/><rect x="23.5" y="4" width="2" height="5" rx=".5" fill="white" opacity=".55"/></svg>
        </div>
      </div>
    </div>

    <!-- Header fijo -->
    <div class="pase-header">
      <h1 id="headerDay">Hoy Jueves 19</h1>
      <button class="close" type="button" onclick="flash('Cerrar pase')" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Scroll -->
    <div class="scroll">
      <div class="container">

        <!-- Promo toast -->
        <div class="promo" id="promo">
          <img class="ill" src="assets/figma/neo-clock.png" alt="" />
          <div class="copy">
            <span class="t1">¿Necesitas más tiempo?</span>
            <span class="t2">Tu primer pase tiene una extensión extra</span>
          </div>
          <button class="pill-btn" type="button" onclick="extendTimer()">15 min +</button>
        </div>

        <!-- Ticket -->
        <div class="ticket">

          <!-- Sección 1 -->
          <div class="tk-head">
            <span class="timer-pill" id="timerPill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/></svg>
              <span id="timerText">15:00 min para ingresar</span>
            </span>
            <h2 class="tk-title" id="sedeName">NEO Providencia</h2>
            <div class="qr-box"><div id="qr"></div></div>
            <div class="pager"><span class="dot"></span><span class="track"></span></div>
          </div>

          <div class="perf"><span class="dash"></span></div>

          <!-- Sección 2 -->
          <div class="tk-mid">
            <span class="tk-eyebrow">Usa tu QR para</span>
            <h3 class="tk-h2">Tu día en NEO Gym</h3>

            <div class="notif" id="notif">
              <img class="ill" src="assets/figma/neo-bell.png" alt="" />
              <div class="copy">Notificaciones en vivo para pases</div>
              <button class="pill-btn" id="notifBtn" type="button" onclick="toggleNotif()">Activar</button>
              <button class="x" type="button" onclick="dismiss('notif')" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
              </button>
            </div>

            <div class="timeline" id="timeline">
              <div class="tl-flow">
                <span class="node done"></span>
                <span class="bar"></span>
                <span class="node"></span>
              </div>
              <div class="tl-rows">
                <div class="tl-row">
                  <span class="tl-left">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
                    <span class="lbl">Check in</span>
                  </span>
                  <span class="tl-time" id="checkinTime">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                    10:45 AM
                  </span>
                </div>
                <div class="tl-sep"></div>
                <div class="tl-row">
                  <span class="tl-left">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
                    <span class="lbl">Check out</span>
                  </span>
                </div>
              </div>
            </div>
          </div>

          <div class="perf"><span class="dash"></span></div>

          <!-- Sección 3 -->
          <div class="tk-foot">
            <p class="note" id="footNote">Con este pase vas a poder hacer entrenamiento libre</p>
            <button class="cta" type="button" onclick="flash('Agregar una reserva')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              Agregar una reserva
            </button>
          </div>

        </div>

      </div>
    </div>

    <div class="toast" id="toast">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.4 2.4 4.6-5.1"/></svg></span>
      <span class="msg"></span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===================== ESCENARIOS =====================
   Cada escenario es una variación de datos de la MISMA pantalla del Figma.
   `group` agrupa en el selector lateral. Para sumar uno nuevo, agregá una entrada. */
const SCENARIOS = {
  'primer-sin-usar': {
    group:'Primer pase',
    label:'Extensión sin usar',
    day:'Hoy Jueves 19',
    sede:'NEO Providencia',
    timer:15*60,
    promo:true,              // se ve el modal "¿Necesitas más tiempo?"
    checkin:'10:45 AM',
  },
  'primer-aplicada': {
    group:'Primer pase',
    label:'Extensión aplicada',
    day:'Hoy Jueves 19',
    sede:'NEO Providencia',
    timer:30*60,             // 15 + 15 aplicados al contador
    promo:false,             // ya usó la extensión, el modal desaparece
    checkin:'10:45 AM',
    successOnLoad:'15 minutos extras agregados',
  },
  'segundo': {
    group:'Segundo pase',
    label:'Sin extensión',
    day:'Hoy Jueves 19',
    sede:'NEO Providencia',
    timer:15*60,
    promo:false,             // la extensión de tiempo no se muestra
    checkin:'10:45 AM',
  },
};
const DEFAULT_SCENARIO='primer-sin-usar';

const $ = (s)=>document.querySelector(s);
let timerId=null, remaining=0;

function fmt(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  $('#timerText').textContent = fmt(remaining)+' min para ingresar';
  const pill=$('#timerPill');
  pill.classList.toggle('urgent', remaining<=180);
}
function startTimer(sec){
  clearInterval(timerId); remaining=sec; renderTimer();
  timerId=setInterval(()=>{
    if(remaining>0){remaining--; renderTimer();}
    else clearInterval(timerId);
  },1000);
}
function extendTimer(){
  remaining+=15*60; renderTimer();
  dismiss('promo');
  snack('15 minutos extras agregados','success');
  setActive('primer-aplicada');   // refleja el estado "Extensión aplicada" en el selector + URL
}

function drawQR(text){
  const el=$('#qr'); el.innerHTML='';
  if(window.QRCode){
    new QRCode(el,{text, width:188, height:188, colorDark:'#0F1217', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.L});
  }else{
    el.innerHTML='<div style="width:188px;height:188px;display:grid;place-items:center;color:#0F1217;font-family:var(--display);font-size:12px">QR</div>';
  }
}

function toggleNotif(){
  const btn=$('#notifBtn');
  if(btn.classList.contains('is-on')) return;
  setNotifOn();
  flash('Notificaciones activadas');
}
function setNotifOn(){
  const btn=$('#notifBtn');
  btn.classList.add('is-on'); btn.textContent='Activadas';
}
function dismiss(id){ $('#'+id).classList.add('dismissed'); }

let toastId=null;
function snack(msg,type){
  const t=$('#toast');
  t.classList.toggle('success', type==='success');
  t.querySelector('.msg').textContent=msg;
  t.classList.add('show');
  clearTimeout(toastId); toastId=setTimeout(()=>t.classList.remove('show'), type==='success'?2600:1800);
}
function flash(msg){ snack(msg,'neutral'); }

function setActive(key){
  document.querySelectorAll('.sc-btn').forEach(b=>b.classList.toggle('active', b.dataset.key===key));
  const url=new URL(location); url.searchParams.set('scenario',key); history.replaceState(null,'',url);
}

function applyScenario(key){
  const sc=SCENARIOS[key]||SCENARIOS[DEFAULT_SCENARIO];
  $('#headerDay').textContent=sc.day;
  $('#sedeName').textContent=sc.sede;
  $('#checkinTime').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'+sc.checkin;

  // Modal de extensión de tiempo
  $('#promo').classList.toggle('dismissed', !sc.promo);
  // Toast de notificaciones en estado base
  const btn=$('#notifBtn');
  $('#notif').classList.remove('dismissed');
  btn.classList.remove('is-on'); btn.textContent='Activar';

  startTimer(sc.timer);
  drawQR('https://neo.app/pase/'+encodeURIComponent(sc.sede.replace(/\s/g,'-'))+'/DEMO-20260915');

  setActive(key);
  if(sc.successOnLoad) setTimeout(()=>snack(sc.successOnLoad,'success'), 450);
}

// Montaje del selector (agrupado por pase)
const dock=$('#scenarioDock');
const title=document.createElement('p'); title.className='dock-title'; title.textContent='Escenarios'; dock.appendChild(title);
let lastGroup=null;
Object.entries(SCENARIOS).forEach(([key,sc])=>{
  if(sc.group && sc.group!==lastGroup){
    const g=document.createElement('div'); g.className='group-label'; g.textContent=sc.group; dock.appendChild(g);
    lastGroup=sc.group;
  }
  const b=document.createElement('button');
  b.className='sc-btn'; b.dataset.key=key; b.textContent=sc.label;
  b.onclick=()=>applyScenario(key);
  dock.appendChild(b);
});

const initial=new URLSearchParams(location.search).get('scenario');
applyScenario(SCENARIOS[initial]?initial:DEFAULT_SCENARIO);
</script>
</body>
</html>
